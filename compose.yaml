services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zilal
      POSTGRES_USER: zilal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - zilal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zilal -d zilal"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  zilal-postgres:
